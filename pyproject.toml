[project]
name = "agent-patterns-langgraph"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.7",
    "langchain-openai>=1.7",
    "langgraph>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "agent_patterns"]
